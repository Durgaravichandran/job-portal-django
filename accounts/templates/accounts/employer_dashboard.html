{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Employer Dashboard</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Employer Dashboard</h1>

            <p>
                Welcome, {{ user.username }}
            </p>

        </div>

        <div class="card">

            <h2>Employer Menu</h2>

            <p>
                <a href="{% url 'post_job' %}" class="btn">
                    Post Job
                </a>
            </p>

            <p>
                <a href="{% url 'my_jobs' %}" class="btn">
                    My Jobs
                </a>
            </p>

            <p>
                <a href="{% url 'job_list' %}" class="btn">
                    View All Jobs
                </a>
            </p>

            <p>
                <a href="{% url 'logout' %}" class="btn">
                    Logout
                </a>
            </p>

        </div>

    </div>

</body>
</html>
