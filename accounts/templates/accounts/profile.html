{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>My Profile</h1>

            <p>
                <strong>Username:</strong>
                {{ user.username }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ user.email }}
            </p>

        </div>


        <div class="card">

            <h2>Update Profile</h2>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Save Profile
                </button>

            </form>

        </div>


        {% if user.profile.resume %}

            <div class="card">

                <h2>Current Resume</h2>

                <a
                    href="{{ user.profile.resume.url }}"
                    target="_blank"
                    class="btn"
                >
                    View Resume
                </a>

            </div>

        {% endif %}


        <a href="{% url 'dashboard' %}">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
