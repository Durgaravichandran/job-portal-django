{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Apply for {{ job.title }}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Apply for {{ job.title }}</h1>

            <p>
                <strong>Company:</strong>
                {{ job.company.name }}
            </p>

            <p>
                <strong>Location:</strong>
                {{ job.location }}
            </p>

            <hr>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <label>
                    Resume
                </label>

                <input
                    type="file"
                    name="resume"
                    accept=".pdf,.doc,.docx"
                    required
                >

                <label>
                    Cover Letter
                </label>

                <textarea
                    name="cover_letter"
                    rows="8"
                    placeholder="Write your cover letter here..."
                ></textarea>

                <button type="submit">
                    Submit Application
                </button>

            </form>

            <br>

            <a href="{% url 'job_detail' job.id %}">
                Back to Job
            </a>

        </div>

    </div>

</body>
</html>
